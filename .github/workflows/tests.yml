name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install CPU dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify dependencies
        run: python -m pip check
      - name: Run CPU tests without model downloads
        run: python -m pytest tests -q
      - name: Check browser JavaScript
        run: node --check rp/ui/static/app.js
      - name: Check launcher syntax
        run: sh -n scripts/launch-rp.sh
